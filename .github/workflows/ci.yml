# Purpose: Validate the Python gateway, OAuth server dependency graph, and Docker images before merges.
# Input/Output: GitHub Actions checks out the branch, installs dependencies from lockfiles, and reports pass/fail status.
# Invariants: CI never reads production secrets, never deploys, and only runs deterministic local verification commands.
# Debugging: Open the failed job log in GitHub Actions, then rerun the same command from the repository root or oauth-server/.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  python-tests:
    name: Python package and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Why this exists: every PR must prove the FastAPI gateway still imports and passes its unit tests.
      # What happens here: install from pyproject.toml including dev extras, then run pytest exactly as documented.
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run Python tests
        run: python -m pytest

  oauth-security:
    name: OAuth npm audit and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: oauth-server

    steps:
      # Why this exists: this PR changes the OAuth server dependency graph to remove vulnerable transitives.
      # What happens here: npm installs strictly from package-lock.json, audits the result, and syntax-checks JS files.
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: oauth-server/package-lock.json

      - name: Install locked Node dependencies
        run: npm ci

      - name: Audit production dependency graph
        run: npm audit --audit-level=low

      - name: Record sensitive dependency versions
        run: npm ls tar brace-expansion jsonwebtoken abbrev qs body-parser @mapbox/node-pre-gyp agent-base ansi-regex are-we-there-yet array-flatten balanced-match bcrypt chownr --all

      - name: Syntax-check JavaScript sources
        run: find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check

  docker-builds:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Why this exists: dependency and Dockerfile changes are only safe if both production images still build.
      # What happens here: build the gateway image and the OAuth image without starting services or reading secrets.
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build gateway image
        run: docker build -f docker/Dockerfile .

      - name: Build OAuth image
        run: docker build -f oauth-server/Dockerfile oauth-server
